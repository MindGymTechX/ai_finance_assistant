# FinAI configuration. Environment variables (see .env.example) override the llm section.
llm:
  chat_model: gpt-4o-mini
  embed_model: text-embedding-3-small
  temperature: 0.2
  max_retries: 3          # NFR11: exponential-backoff retries on every LLM call
  timeout_seconds: 60

storage:
  data_dir: .finai        # SQLite (checkpoints, profiles, cache) + vector index

market:
  exchange_suffix: .NS     # NSE by default (BSE quotes on Yahoo are 15 min delayed)
  ttl_open_minutes: 5      # NFR4 refresh interval while the market is open
  stale_limit_minutes: 60  # NFR4 oldest price still shown (with a warning) if the source is down
  open_time: "09:15"
  close_time: "15:30"
  timezone: Asia/Kolkata

portfolio:
  single_stock_limit_pct: 20     # concentration flag thresholds (educational)
  single_sector_limit_pct: 40

goals:
  assumptions_as_of: "2026-11-01"
  inflation_pct: 6.0
  expected_return_pct:           # illustrative long-run assumptions by risk appetite
    cautious: 8.0
    moderate: 10.0
    aggressive: 12.0

rag:
  chunk_size: 800
  chunk_overlap: 120
  top_k: 4
  min_score: 0.30          # FR14: below this, "no reliable source"

agents:
  budgets:                 # max tool calls per agent run
    finance_qa: 3
    tax_education: 3
    portfolio: 4
    market: 4
    goal_planning: 3
    news: 4
  history_turns: 6         # recent messages passed to router/agents

evaluator:
  max_retries: 2
  llm_check: true          # second-stage LLM check for subtle advice (rules run first)

news:
  days: 7
  max_items: 8
