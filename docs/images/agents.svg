<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="Helvetica, Arial, sans-serif">
  <title>FinAI agent communication</title>
  <rect width="680" height="470" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
  <g stroke-width="0.8">
    <rect x="40" y="20" width="160" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
    <rect x="260" y="20" width="160" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
    <rect x="480" y="20" width="160" height="48" rx="8" fill="#FAECE7" stroke="#993C1D"/>
    <rect x="20" y="100" width="640" height="232" rx="12" fill="none" stroke="#888780" stroke-dasharray="4 3"/>
    <g fill="#FAECE7" stroke="#993C1D">
      <rect x="40" y="140" width="180" height="56" rx="8"/><rect x="250" y="140" width="180" height="56" rx="8"/><rect x="460" y="140" width="180" height="56" rx="8"/>
      <rect x="40" y="240" width="180" height="56" rx="8"/><rect x="250" y="240" width="180" height="56" rx="8"/><rect x="460" y="240" width="180" height="56" rx="8"/>
      <rect x="40" y="360" width="180" height="48" rx="8"/><rect x="250" y="360" width="180" height="48" rx="8"/>
    </g>
    <rect x="460" y="360" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <g fill="#2C2C2A"><text x="120" y="49">User message</text><text x="340" y="49">Input guard</text><text x="550" y="389">Reply + footer</text></g>
    <g fill="#712B13">
      <text x="560" y="49">Router</text>
      <text x="130" y="164">Finance Q&amp;A</text><text x="340" y="164">Tax education</text><text x="550" y="164">Goal planning</text>
      <text x="130" y="264">Portfolio</text><text x="340" y="264">News synthesizer</text><text x="550" y="264">Market</text>
      <text x="130" y="389">Synthesizer</text><text x="340" y="389">Evaluator</text>
    </g>
  </g>
  <g font-size="12" text-anchor="middle" fill="#993C1D">
    <text x="130" y="183">agentic RAG</text><text x="340" y="183">agentic RAG, tax only</text><text x="550" y="183">asks, then calculates</text>
    <text x="130" y="283">holdings maths</text><text x="340" y="283">fetch and digest</text><text x="550" y="283">quotes and history</text>
  </g>
  <g font-size="12" fill="#5F5E5A">
    <text x="36" y="124" font-size="14" font-weight="bold" fill="#2C2C2A">Specialist agents, in parallel</text>
    <text x="644" y="124" text-anchor="end">write to shared state</text>
    <text x="340" y="320" text-anchor="middle">Portfolio and Market call News as a tool</text>
    <text x="350" y="454">fails: retry, max 2, then safe fallback</text>
  </g>
  <g stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)">
    <line x1="200" y1="44" x2="258" y2="44"/><line x1="420" y1="44" x2="478" y2="44"/><line x1="560" y1="68" x2="560" y2="98"/>
    <line x1="220" y1="268" x2="248" y2="268"/><line x1="460" y1="268" x2="432" y2="268"/>
    <line x1="130" y1="332" x2="130" y2="358"/><line x1="220" y1="384" x2="248" y2="384"/><line x1="430" y1="384" x2="458" y2="384"/>
    <path d="M340 408 L340 432 L130 432 L130 410"/>
  </g>
</svg>
