<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="Helvetica, Arial, sans-serif">
  <title>FinAI actors</title>
  <rect width="680" height="440" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5"/></marker></defs>
  <g font-size="14" text-anchor="middle">
    <!-- personas -->
    <g fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8">
      <rect x="20" y="90" width="120" height="56" rx="8"/><rect x="20" y="170" width="120" height="56" rx="8"/>
      <rect x="20" y="250" width="120" height="56" rx="8"/><rect x="20" y="330" width="120" height="56" rx="8"/>
    </g>
    <g fill="#3C3489" font-weight="bold">
      <text x="80" y="114">Riya, 24</text><text x="80" y="194">Arjun, 31</text>
      <text x="80" y="274">Meena, 38</text><text x="80" y="354">Vikram, 45</text>
    </g>
    <g fill="#534AB7" font-size="12">
      <text x="80" y="132">Learner</text><text x="80" y="212">Checks stocks</text>
      <text x="80" y="292">Plans a goal</text><text x="80" y="372">Takes control</text>
    </g>
    <!-- system -->
    <rect x="170" y="40" width="330" height="380" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="335" y="64" fill="#085041" font-weight="bold">FinAI</text>
    <text x="335" y="82" fill="#0F6E56" font-size="12">One chat + 4 tabs</text>
    <g fill="#ffffff" stroke="#888780" stroke-width="0.8">
      <rect x="190" y="100" width="140" height="40" rx="6"/><rect x="345" y="100" width="140" height="40" rx="6"/>
      <rect x="190" y="152" width="140" height="40" rx="6"/><rect x="345" y="152" width="140" height="40" rx="6"/>
      <rect x="190" y="204" width="140" height="40" rx="6"/><rect x="345" y="204" width="140" height="40" rx="6"/>
    </g>
    <g fill="#2C2C2A">
      <text x="260" y="125">Learn concepts</text><text x="415" y="125">Live prices</text>
      <text x="260" y="177">Learn tax rules</text><text x="415" y="177">Read news</text>
      <text x="260" y="229">Portfolio check</text><text x="415" y="229">Plan a goal</text>
    </g>
    <g fill="#FAECE7" stroke="#993C1D" stroke-width="0.8">
      <rect x="190" y="264" width="295" height="56" rx="6"/><rect x="190" y="340" width="295" height="56" rx="6"/>
    </g>
    <text x="337" y="288" fill="#712B13" font-weight="bold">Remember profile</text>
    <text x="337" y="306" fill="#993C1D" font-size="12">Knowledge, goals, risk, holdings</text>
    <text x="337" y="364" fill="#712B13" font-weight="bold">Education only</text>
    <text x="337" y="382" fill="#993C1D" font-size="12">Disclaimer on every answer</text>
    <!-- externals -->
    <g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8">
      <rect x="530" y="70" width="135" height="56" rx="8"/><rect x="530" y="140" width="135" height="56" rx="8"/>
      <rect x="530" y="210" width="135" height="56" rx="8"/><rect x="530" y="280" width="135" height="56" rx="8"/>
      <rect x="530" y="350" width="135" height="56" rx="8"/>
    </g>
    <g fill="#2C2C2A" font-weight="bold">
      <text x="597" y="94">Knowledge base</text><text x="597" y="164">Market data</text>
      <text x="597" y="234">News feed</text><text x="597" y="304">OpenAI LLM</text><text x="597" y="374">Claude Desktop</text>
    </g>
    <g fill="#5F5E5A" font-size="12">
      <text x="597" y="112">100+ articles</text><text x="597" y="182">yfinance, NSE</text>
      <text x="597" y="252">Yahoo RSS</text><text x="597" y="322">gpt-4o-mini</text><text x="597" y="392">MCP, stretch</text>
    </g>
  </g>
  <g stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)">
    <line x1="140" y1="118" x2="168" y2="118"/><line x1="140" y1="198" x2="168" y2="198"/>
    <line x1="140" y1="278" x2="168" y2="278"/><line x1="140" y1="358" x2="168" y2="358"/>
    <line x1="502" y1="98" x2="528" y2="98"/><line x1="502" y1="168" x2="528" y2="168"/>
    <line x1="502" y1="238" x2="528" y2="238"/><line x1="502" y1="308" x2="528" y2="308"/>
    <line x1="528" y1="378" x2="502" y2="378"/>
  </g>
</svg>
